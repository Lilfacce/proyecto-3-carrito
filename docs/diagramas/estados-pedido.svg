al, sans-serif" font-size="18" font-weight="700" fill="#5c5958" text-anchor="middle">Cancelado</text><path d="M380 152 H552" fill="none" stroke="#332f2d" stroke-width="2" marker-end="url(#flecha)"/><text x="466" y="142" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">Marcar como enviado</text><text x="466" y="174" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="middle">administrador</text><path d="M750 152 H922" fill="none" stroke="#332f2d" stroke-width="2" marker-end="url(#flecha)"/><text x="836" y="142" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">Marcar como entregado</text><text x="836" y="174" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="middle">administrador</text><text x="1025" y="216" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="middle">El pago contra entrega</text><text x="1025" y="234" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="middle">pasa a aprobado</text><path d="M285 184 V302 H552" fill="none" stroke="#332f2d" stroke-width="2" marker-end="url(#flecha)"/><text x="300" y="246" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">Cancelar</text><text x="300" y="266" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="start">cliente o administrador</text><text x="300" y="285" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="start">devuelve el stock</text><rect x="930" y="270" width="190" height="64" rx="32" fill="none" stroke="#d9d9d9" stroke-width="2"/><rect x="92