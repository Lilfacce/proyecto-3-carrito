</defs><text x="40" y="44" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Arquitectura de tres capas</text><text x="40" y="70" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#787574" text-anchor="start">El navegador habla solo con la API; la API es la única que toca la base de datos y los archivos.</text><rect x="40" y="110" width="300" height="236" rx="16" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5" filter="url(#sombra)"/><text x="64" y="150" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">Navegador</text><text x="64" y="172" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#787574" text-anchor="start">Frontend · frontend/src</text><line x1="64" y1="188" x2="316" y2="188" stroke="#ebebeb"/><circle cx="70" cy="214" r="3" fill="#787574"/><text x="82" y="219" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">React 19 + React Router 7</text><circle cx="70" cy="240" r="3" fill="#787574"/><text x="82" y="245" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">Vite 8 · Tailwind CSS 4</text><circle cx="70" cy="266" r="3" fill="#787574"/><text x="82" y="271" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">Contextos: sesión, carrito, avisos</text><circle cx="70" cy="292" r="3" fill="#787574"/><text x="82" y="297" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">Sin acceso al token (cookie httpOnly)</text><rect x="490" y="110" width="300" height="236" rx="16" fill="#ffffff" stroke="#5433eb" stroke-width="2" filter="url(#sombra)"/><text x="514" y="150" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">API REST</text><text x="514" y="172" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#787574" text-anchor="start">Backend · backend/src</text><line x1="514" y1="188" x2="766" y2="188" stroke="#ebebeb"/><circle cx="520" cy="214" r="3" fill="#5433eb"/><text x="532" y="219" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">Node.js + Express 5</text><circle cx="520" cy="240" r="3" fill="#5433eb"/><text x="532" y="245" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">Validación con Zod</text><circle cx="520" cy="266" r="3" fill="#5433eb"/><text x="532" y="271" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">JWT + bcrypt · roles cliente/admin</text><circle cx="520" cy="292" r="3" fill="#5433eb"/><text x="532" y="297" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">Helmet · límite de intentos · CSRF</text><rect x="940" y="110" width="300" height="236" rx="16" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5" filter="url(#sombra)"/><text x="964" y="150" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#000000" text-anchor="start">PostgreSQL</text><text x="964" y="172" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#787574" text-anchor="start">Base de datos</text><line x1="964" y1="188" x2="1216" y2="188" stroke="#ebebeb"/><circle cx="970" cy="214" r="3" fill="#787574"/><text x="982" y="219" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">7 tablas con restricciones CHECK</text><circle cx="970" cy="240" r="3" fill="#787574"/><text x="982" y="245" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">Transacciones (BEGIN / COMMIT)</text><circle cx="970" cy="266" r="3" fill="#787574"/><text x="982" y="271" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">Bloqueo de filas: FOR UPDATE</text><circle cx="970" cy="292" r="3" fill="#787574"/><text x="982" y="297" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#332f2d" text-anchor="start">Consultas parametrizadas ($1, $2…)</text><line x1="340" y1="206" x2="490" y2="206" stroke="#332f2d" stroke-width="2" marker-end="url(#flecha)"/><text x="415" y="194" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">HTTP + JSON</text><text x="415" y="228" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="middle">cookie de sesión</text><line x1="490" y1="270" x2="340" y2="270" stroke="#787574" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flecha)"/><text x="415" y="292" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="middle">respuesta JSON</text><line x1="790" y1="206" x2="940" y2="206" stroke="#332f2d" stroke-width="2" marker-end="url(#flecha)"/><text x="865" y="194" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">SQL</text><text x="865" y="228" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="middle">librería pg</text><line x1="940" y1="270" x2="790" y2="270" stroke="#787574" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#flecha)"/><text x="865" y="292" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#787574" text-anchor="middle">filas</text><path d="M600 346 L600 374 L500 374 L500 402" fill="none" stroke="#332f2d" stroke-width="1.5" marker-end="url(#flecha)"/><path d="M680 346 L680 374 L780 374 L780 402" fill="none" stroke="#332f2d" stroke-width="1.5" marker-end="url(#flecha)"/><rect x="400" y="402" width="200" height="64" rx="12" fill="#f2f4f5" stroke="#d9d9d9"/><text x="416" y="428" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">Fotos de productos</text><text x="416" y="450" font-family="Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#787574" text-anchor="start">backend/uploads/ → /uploads</text><rect x="680" y="402" width="200" height="64" rx="12" fill="#f2f4f5" stroke="#d9d9d9"/><text x="696" y="428" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">Correo simulado</text><text x="696" y="450" font-family="Consolas, 'Cascadia Mono', monospace" font-size="12" font-weight="400" fill="#787574" text-anchor="start">consola del backend</text><rect x="40" y="496" width="580" height="40" rx="20" fill="#efecfd"/><text x="58" y="521" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#5433eb" text-anchor="start">Desarrollo</text><text x="168" y="521" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#332f2d" text-anchor="start">Vite :5173 reenvía /api y /uploads a la API :3000</text><rect x="660" y="496" width="580" height="40" rx="20" fill="#efecfd"/><text x="678" y="521" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#5433eb" text-anchor="start">Demostración</text><text x="788" y="521" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#332f2d" text-anchor="start">Express :3000 sirve la API y frontend/dist</text></svg>